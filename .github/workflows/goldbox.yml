# goldbox: build this fork's pinned SDL3 libraries and publish it as the release "goldbox".
#
# Pushing the tag goldbox builds the pins in goldbox/toolchain with goldbox/sdl3-setup.sh (x86-64 and i386 Linux and 32- and 64-bit Windows from Linux, and Apple Silicon macOS) and
# replaces the release goldbox with one archive per platform and a SHA256SUMS listing them. Moving the tag (delete it,
# push it again) rebuilds. Deleting the tag deletes the release. goldbox/sdl3-setup.sh and goldbox/toolchain-release.sh
# are copies of Pool of Radiance's scripts of the same names (talonius/bc-pool-of-radiance, scripts/), which download
# these archives from this release; keep them in step. Each archive's name carries the pins it was built from, so a
# consumer asking for other pins finds no file rather than the wrong build.
#
# A delete event runs the default branch's copy of this file, so goldbox, the pinned upstream source plus this
# directory, is the default branch.

name: goldbox

on:
  push:
    tags: [goldbox]
  delete:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: goldbox
          fetch-depth: 1
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential git curl python3 pkg-config cmake ninja-build zstd mingw-w64 gcc-multilib g++-multilib libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        # release_pack needs GNU tar (--sort), split and sha256sum.
        run: |
          brew install gnu-tar coreutils zstd
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build and pack
        env:
          TOOLCHAIN_FILE: ${{ github.workspace }}/goldbox/toolchain
          FPC_PREFIX: ${{ runner.temp }}/prefix
          SDL_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: goldbox/sdl3-setup.sh --pack "$RUNNER_TEMP/dist"
      - name: Build log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/prefix/cache/*.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ runner.temp }}/dist

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: goldbox
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the goldbox release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir out
          for d in dist/*/; do
              cat "$d/SHA256SUMS" >> out/SHA256SUMS
              find "$d" -name '*.tar.zst*' -exec cp {} out/ \;
          done
          sort -k 2 -o out/SHA256SUMS out/SHA256SUMS
          cat out/SHA256SUMS
          {
              echo "SDL3 libraries, built by goldbox/sdl3-setup.sh from the pins in goldbox/toolchain at $SHA:"
              echo
              echo '```'
              grep -v '^#' "$GITHUB_WORKSPACE/goldbox/toolchain" 2> /dev/null || true
              echo '```'
              echo
              echo "The source is this repository at that commit. Built $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID."
          } > notes.md
          gh release delete goldbox --yes 2> /dev/null || true
          gh release create goldbox out/* --verify-tag --title goldbox --notes-file notes.md

  remove:
    if: github.event_name == 'delete' && github.event.ref_type == 'tag' && github.event.ref == 'goldbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the goldbox release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete goldbox --yes || echo "There was no goldbox release."
